[project]
name = "stock-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.3.2",
  "pandas>=2.3.2",
  "pyarrow>=23.0.1",
  "rich>=14.1.0",
  "pyyaml>=6.0.3",
  "tqdm>=4.67.3",
  "mcp>=1.28.1",
  "pywin32>=311; sys_platform == 'win32'",
]

[dependency-groups]
viewer = ["fastapi>=0.139.0", "uvicorn>=0.47.0", "pydantic>=2.0"]
static-report = ["panel>=1.8.10", "plotly>=6.5.2"]
dev = [
  "mypy>=1.0",
  "pyright>=1.1",
  "pre-commit>=4.5.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "rich>=15.0.0",
  "ruff>=0.15.10",
  "detect-secrets>=1.5.0",
  "httpx>=0.28.1",
  "pre-commit-hooks==6.0.0",
]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
explicit_package_bases = true
exclude = ["^tasks/", "^stock-data-downloader/"]

[tool.pyright]
extraPaths = ["StockProject"]
