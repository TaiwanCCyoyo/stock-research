<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>一起把研究方向說清楚 · 互動示範</title>
        <link rel="stylesheet" href="discussion.css" />
        <style>
            body {
                margin: 0;
                background: #f5f8f5;
            }
        </style>
    </head>
    <body>
        <main id="discussion"></main>
        <noscript
            >這個互動示範需要
            JavaScript。沒有執行任何研究，也沒有保存或送出選擇。</noscript
        >
        <script id="discussion-data" type="application/json">
            {
                "schema": "direction-discussion.v1",
                "demo": true,
                "source": {

                    "draftPath": "教學示例，未連接實際方向草稿",
                    "revision": "demo-v1"

                "ownerPurpose": "找出可研究的停損方法",
                "purposeStatus": "pending",
                "outcomes": [
                    {
                        "id": "supports",
                        "title": "如果成立",
                        "headline": "這類訊號可能值得再研究：錯殺比例為 ▢▢%。",
                        "decision": "把訊號列為候選，再比較實際出場後的報酬與回撤。",
                        "limitation": "光看錯殺比例，還不知道停損是否比繼續持有更好。"
                    },
                    {

                    }
                ],
                "choices": [
                    {
                        "id": "C1",
                        "question": "這次要走到停損方法的哪一步？",

                            },
                            {
                                "id": "exit-comparison",
                                "label": "進一步比較停損後報酬與回撤",
                                "impact": "承諾：比較候選出場方式與繼續持有。需要另外定義出場價格、成交限制、成本與是否再進場；工作較多，卻更接近停損方法的問題。這是範圍提議，尚未定案。"
                            }
                        ]
                    },
                    {
                        "id": "C2",
                        "question": "標題與主要比較要承諾哪些倍數？",

                            },
                            {
                                "id": "all-primary",
                                "label": "2／3／5／10 倍都列為主要問題",

                        ]
                    }
                ],
                "questions": [
                    {
                        "reference": "demo-prior#Q1",
                        "question": "型態在強勢條件之外，是否還有額外貢獻？",

                        "reason": "如果前作只看強勢條件，不能直接把結果解讀成型態沒有用。新方向要承接這個問題，或說明為何本次先不處理。",

        <script src="discussion.js"></script>
        <script>
            DirectionDiscussion.mount(
                document.getElementById("discussion"),
                JSON.parse(
                    document.getElementById("discussion-data").textContent,
                ),
            );
        </script>

</html>
