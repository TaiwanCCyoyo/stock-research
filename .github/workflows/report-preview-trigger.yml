name: Report preview trigger

# Marks that a PR's preview state may have changed. It runs PR-side, so it holds no permissions
# and does nothing; its completion starts the default-branch reconcile in report-preview.yml.
# Uses `pull_request` (never `pull_request_target`); fork PRs are skipped and never published.

on:
    pull_request:
        branches: [main]
        types: [labeled, unlabeled, synchronize, reopened, closed]

permissions: {}

jobs:
    trigger:
        name: report-preview-trigger
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository &&
            ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name == 'preview' ||
            github.event.action != 'labeled' && github.event.action != 'unlabeled' && contains(github.event.pull_request.labels.*.name, 'preview'))
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions: {}
        steps:
            - run: echo "Preview state may have changed; report-preview.yml rebuilds the site from the default branch."
