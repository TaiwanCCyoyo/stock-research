repos:
    # Basic out-of-the-box checks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
            # Owner approved: root baseline 1 MiB; all other added files keep 500 KiB.
            entry: python scripts/check_added_large_files.py

    # Detect Secrets (Replaces the legacy security-scanner skill)
    - repo: https://github.com/Yelp/detect-secrets
      rev: v1.5.0
      hooks:
          - id: detect-secrets
            # The scanner otherwise silently skips UTF-8 text on Windows locale decode errors.
            entry: python -X utf8 -m detect_secrets.pre_commit_hook
            # Audited, exact checksum false positives; new values remain subject to scanning.
            args: [--baseline, .secrets.baseline]
            exclude: package\.lock\.json

    # Prettier (formats every language it supports: TS/JS, HTML, CSS, JSON,
    # YAML, Markdown, etc.). `types: [text]` + --ignore-unknown, both defined
    # upstream, mean new supported extensions never need config here.
    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.5
      hooks:
          - id: prettier

    # Enforce UTF-8 encoding and reject decode corruption. The language constraint this
    # hook used to carry was removed on 2026-08-23; see scripts/file_hygiene.py.
    - repo: local
      hooks:
          - id: file-validation
            name: File Hygiene (UTF-8 encoding)
            entry: uv run python scripts/file_hygiene.py --file
            language: system
            types: [text]
            exclude: ^(uv\.lock|.*\.json)$ # Optional: exclude specific auto-generated files if needed
          - id: mypy
            name: Mypy (Targeted Python Check)
            entry: uv run python scripts/check_mypy_scopes.py
            language: system
            types: [python]
            require_serial: true # Mypy batches share one SQLite cache.
          - id: pyright
            name: Pyright (Targeted Python Check)
            entry: uv run pyright
            language: system
            types: [python]

    # Ruff (Python Linter & Formatter)
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.10
      hooks:
          - id: ruff
            args: [--fix]
          - id: ruff-format

    # Taplo (TOML Formatter)
    - repo: https://github.com/ComPWA/taplo-pre-commit
      rev: v0.9.3
      hooks:
          - id: taplo-format
